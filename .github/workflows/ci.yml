name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lint:
    name: GDScript lint + format check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install gdtoolkit
        run: pip install "gdtoolkit==4.*"

      - name: Format check (gdformat)
        run: gdformat --check src/

      - name: Lint (gdlint)
        run: gdlint src/

  test:
    name: Sim tests (headless Godot)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true  # Sprite PNGs are LFS; tests load SpriteFrames built on them.

      - name: Set up Godot 4.3
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.3.0
          use-dotnet: false
          include-templates: false

      - name: Import assets
        run: godot --headless --path . --import || true

      - name: Unit tests
        run: godot --headless --path . -s res://tests/run_tests.gd

      - name: Gameplay smoke test
        run: godot --headless --path . -s res://tests/run_sim_smoke.gd
